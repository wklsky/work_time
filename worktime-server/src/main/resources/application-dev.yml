spring:
  datasource:
    url: jdbc:mysql://localhost:3306/worktime_db?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  level:
    com.worktime: debug
    org.springframework.security: debug
